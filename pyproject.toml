[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codoc"
version = "0.1.0"
description = "Self-healing technical documentation monitor and repair engine"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "openai>=1.40",
]

[project.scripts]
codoc = "codoc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
