name: CoDoc Marketplace Release & GHCR Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Quality Gate Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Test Suite
        run: pytest

      - name: Run Type Checking
        run: mypy src tests

  release-image:
    name: Build & Publish Container Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Floating Major Version Git Tag (e.g. v1)
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "main" ]]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi
          MAJOR_TAG=$(echo "$TAG_NAME" | grep -oE '^v[0-9]+')
          if [[ -n "$MAJOR_TAG" ]]; then
            echo "Updating floating major tag $MAJOR_TAG -> $TAG_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -fa "$MAJOR_TAG" -m "Update $MAJOR_TAG floating alias to $TAG_NAME"
            git push origin "$MAJOR_TAG" --force
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ -z "$TAG_NAME" || "$TAG_NAME" == "main" ]]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi
          gh release create "$TAG_NAME" \
            --title "CoDoc $TAG_NAME" \
            --generate-notes \
            --verify-tag
