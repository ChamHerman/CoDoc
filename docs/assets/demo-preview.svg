        <text x="22" y="110" class="font-mono" font-size="10" fill="#f87171">- score = engine.calculate_risk(tx_id)</text>
        <text x="22" y="128" class="font-mono" font-size="10" fill="#34d399">+ score = engine.calculate_risk(</text>
