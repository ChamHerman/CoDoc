    <text x="145" y="24" class="font-sans" font-size="14" fill="#94a3b8">/ End-to-End Walkthrough Demonstration</text>
    <text x="64" y="44" class="font-mono" font-size="12" fill="#38bdf8">GitHub Actions CI Pipeline • Self-Healing Documentation Engine</text>

