      <g transform="translate(14, 52)">
        <text x="0" y="0" class="font-mono" font-size="11" fill="#64748b">@@ -14,3 +14,5 @@</text>
        <text x="0" y="22" class="font-mono" font-size="11" fill="#94a3b8"> class RiskEngine:</text>
        
