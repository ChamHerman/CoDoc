          <circle cx="20" cy="22" r="8" fill="#10b981" />
          <text x="20" y="26" font-size="10" text-anchor="middle" fill="#ffffff">✓</text>
          <text x="36" y="24" class="font-mono" font-size="11" fill="#e2e8f0" font-weight="600">3. LLM Staleness Verification</text>
          <text x="36" y="42" class="font-sans" font-size="11" fill="#94a3b8">GPT-4o-mini structured schema verification.</text>
          <text x="36" y="58" class="font-mono" font-size="10" fill="#f59e0b">Confidence: 0.94 • Simple Repair</text>
