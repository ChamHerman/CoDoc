        <text x="0" y="86" class="font-mono" font-size="11" fill="#34d399">+                      *, weights: dict | None = None) -&gt; float:</text>
        
        <text x="0" y="112" class="font-mono" font-size="11" fill="#94a3b8">         """Evaluates transaction risk."""</text>
        <text x="0" y="132" class="font-mono" font-size="11" fill="#94a3b8">         # Compute real-time weight matrix</text>
        <text x="0" y="152" class="font-mono" font-size="11" fill="#94a3b8">         return score</text>

        <!-- Stale Warning Card -->
        <g transform="translate(0, 185)">
