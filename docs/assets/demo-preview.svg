      <circle cx="16" cy="15" r="5" fill="#10b981" />
      <text x="30" y="20" class="font-mono" font-size="11" fill="#cbd5e1">Action v1.0.0</text>

      <rect x="142" y="0" width="118" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="156" y="20" class="font-mono" font-size="11" fill="#f59e0b">⏱️ 02:45 MIN</text>
    </g>
