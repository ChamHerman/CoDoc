          <rect x="14" y="36" width="294" height="24" rx="4" fill="#1e293b" />
          <text x="22" y="52" class="font-mono" font-size="10" fill="#cbd5e1">Verified: 1 | Repaired: 1 | Stale: 0</text>
          
