<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="playBtnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Card Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="playGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Panel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="diffRemoved" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="diffAdded" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace; }
  </style>

  <!-- Deep Background -->
  <rect width="1280" height="720" fill="url(#bgGradient)" />

  <!-- Ambient Light Accents -->
  <circle cx="200" cy="180" r="280" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="1080" cy="540" r="320" fill="#6366f1" opacity="0.10" filter="url(#glow)" />
  <circle cx="640" cy="360" r="240" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.06">
    <path d="M 0,80 L 1280,80 M 0,160 L 1280,160 M 0,240 L 1280,240 M 0,320 L 1280,320 M 0,400 L 1280,400 M 0,480 L 1280,480 M 0,560 L 1280,560 M 0,640 L 1280,640" stroke="#ffffff" stroke-width="1" />
    <path d="M 160,0 L 160,720 M 320,0 L 320,720 M 480,0 L 480,720 M 640,0 L 640,720 M 800,0 L 800,720 M 960,0 L 960,720 M 1120,0 L 1120,720" stroke="#ffffff" stroke-width="1" />
