          <circle cx="20" cy="22" r="8" fill="#10b981" />
          <text x="20" y="26" font-size="10" text-anchor="middle" fill="#ffffff">✓</text>
          <text x="36" y="24" class="font-mono" font-size="11" fill="#a7f3d0" font-weight="600">4. 3-Criteria Validator Gate</text>
          <text x="36" y="44" class="font-sans" font-size="10" fill="#cbd5e1">• Factual Accuracy: <tspan fill="#34d399">PASS (1.00)</tspan></text>
          <text x="36" y="58" class="font-sans" font-size="10" fill="#cbd5e1">• Prose Preservation: <tspan fill="#34d399">PASS (0.98)</tspan></text>
          <text x="36" y="72" class="font-sans" font-size="10" fill="#cbd5e1">• Style Consistency: <tspan fill="#34d399">PASS (1.00)</tspan></text>
        </g>

