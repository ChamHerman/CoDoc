        <text x="14" y="44" class="font-mono" font-size="10" fill="#94a3b8">Branch: codoc/fix-pr-42</text>
        <text x="14" y="62" class="font-sans" font-size="11" fill="#cbd5e1">"[CoDoc] Auto-repair risk.md documentation"</text>
        
        <rect x="14" y="74" width="294" height="92" rx="6" fill="#090d16" />
