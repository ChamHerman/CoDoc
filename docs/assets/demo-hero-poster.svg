<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="posterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#posterBg)" />
  <circle cx="640" cy="360" r="300" fill="#0284c7" opacity="0.15" />

  <g transform="translate(640, 220)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#heroGradient)" letter-spacing="-1">CoDoc in Action</text>
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="24" fill="#cbd5e1">Autonomous Code-to-Documentation Synchronization &amp; Self-Healing</text>
    <text y="90" font-family="'Fira Code', monospace" font-size="16" fill="#38bdf8">GitHub Actions Native • Zero Doc Rot • &lt; 30s CI Execution</text>
  </g>

  <!-- Big Play Button Center -->
  <g transform="translate(640, 420)">
    <circle cx="0" cy="0" r="54" fill="#0284c7" />
    <polygon points="-10,-22 22,0 -10,22" fill="#ffffff" />
    <text y="90" font-family="'Fira Code', monospace" font-size="16" text-anchor="middle" fill="#94a3b8">2m 45s Full End-to-End Walkthrough</text>
  </g>
</svg>
